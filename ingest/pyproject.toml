[project]
name = "ingest"
version = "0.1.0"
description = "Import precomputed three-way crossings into the minimal Tripothesis website."
requires-python = ">=3.11"
dependencies = [
  "click",
  "psycopg2-binary",
  "python-dotenv",
  "requests",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest*"]

[tool.setuptools.package-data]
ingest = ["data/*"]
