name: Build dev deployment images

on:
  pull_request:
    paths:
      - '.github/workflows/build-dev-images.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.dev.yaml'
      - 'package*.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - '*config.*'
      - 'src/**'
      - 'public/**'
      - 'db/**'
      - 'enrich/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned images to Docker Hub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dev-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tripotheses-lite-app
            context: .
          - service: tripotheses-lite-postgres
            context: ./db
          - service: tripotheses-lite-enrich
            context: ./enrich
    steps:
      - uses: actions/checkout@v4

      - name: Read the deployment image tag
        id: image
        env:
          POSTGRES_PASSWORD: build-only
          AUTHORIZATION_HEADER: build-only
          SERVICE: ${{ matrix.service }}
        run: |
          image=$(docker compose -f docker-compose.dev.yaml --profile web config --format json | jq -r --arg service "$SERVICE" '.services[$service].image')
          printf 'name=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build on native AMD64
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
